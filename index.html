const quickbar=document.getElementById('quickbar');function renderQuickbar(){if(!quickbar)return;quickbar.replaceChildren();quickSlots.forEach((id,i)=>{let it=QUICK_ITEMS.find(x=>x.id===id)||QUICK_ITEMS[5],b=document.createElement('button');b.className=i===selectedQuick?'active':'';b.innerHTML='<small>'+(i+1)+'</small>'+it.name+(id==='potion'||id==='blade'?'<small>x'+(inventory[id]||0)+'</small>':'');b.onclick=()=>{selectedQuick=i;useQuick(i);renderQuickbar()};quickbar.appendChild(b)})}
function useQuick(i){if(gameMode!=='playing'||quickCooldown>0||dialog.length)return;let id=quickSlots[i];selectedQuick=i;if(id==='none'||(id==='blade'&&!(inventory.blade>0))||(id==='potion'&&!(inventory.potion>0)))return;quickCooldown=14;if(id==='potion'){if((inventory.potion||0)>0&&player.hp<player.maxHp){inventory.potion--;player.hp++;burst(player.x,player.y,25,'#6ce4a1')}}else if(id==='aeris'){if(player.hp<player.maxHp){player.hp++;burst(player.x,player.y,25,'#6ce4a1')}}else if(id==='dash'){player.vx=player.face*14;burst(player.x,player.y,12,'#222222')}else if(id==='blade'){for(let e of enemy){if(e.alive&&Math.abs(e.x-player.x)<90){hitGuard(e,1,player.face,worlds[phase].ground)}}burst(player.x+player.face*30,player.y,12,'#ddd')}else if(id==='explosion'){keys.KeyJ=true;setTimeout(()=>keys.KeyJ=false,100)}renderQuickbar()}

function showQuickConfig(){clearMenu();let label=document.createElement('p');label.textContent='Escolhe o espaço (1–5) e depois a arma, item ou habilidade. As alterações são guardadas com a partida.';menuButtons.appendChild(label);quickSlots.forEach((id,i)=>{let heading=document.createElement('div');heading.className='quickheading';heading.textContent='Tecla '+(i+1)+' — '+(QUICK_ITEMS.find(x=>x.id===id)?.name||'Vazio');menuButtons.appendChild(heading);let grid=document.createElement('div');grid.className='quickselect';menuButtons.appendChild(grid);QUICK_ITEMS.filter(it=>!['blade','potion'].includes(it.id)||(inventory[it.id]||0)>0).forEach(it=>{let b=document.createElement('button');b.textContent=it.kind+' · '+it.name;b.style.opacity=id===it.id?'1':'.7';b.onclick=()=>{quickSlots[i]=it.id;renderQuickbar();showQuickConfig()};grid.appendChild(b)})});button('Voltar à pausa',()=>showMenu('paused'))}
addEventListener('keydown',e=>{if(gameMode==='playing'&&/^Digit[1-5]$/.test(e.code)){e.preventDefault();useQuick(Number(e.code.slice(-1))-1)}});
const overlay=document.getElementById('overlay'),menuButtons=document.getElementById('menuButtons'),notice=document.getElementById('notice'),pauseButton=document.getElementById('pauseButton'),SAVE_KEY='uslords_tnt_slots_v2';
function getSlots(){try{return JSON.parse(localStorage.getItem(SAVE_KEY))||[null,null,null]}catch(e){return [null,null,null]}}
function setSlots(slots){localStorage.setItem(SAVE_KEY,JSON.stringify(slots))}
function fmtTime(sec){sec=Math.max(0,Math.floor(sec||0));let h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}h ${m}m`:`${m}m ${s}s`}
function chapterName(ph){return 'Capítulo '+(ph+1)+' · '+(worlds[ph]?.name||'Speranzu')}
function button(label,action,disabled=false){let b=document.createElement('button');b.textContent=label;b.disabled=disabled;b.onclick=action;menuButtons.appendChild(b)}
function clearMenu(){menuButtons.replaceChildren();notice.textContent=''}
function renderSlots(mode){clearMenu();let slots=getSlots(),grid=document.createElement('div');grid.className='slots';menuButtons.appendChild(grid);slots.forEach((s,index)=>{let b=document.createElement('button');b.className='slot';let title=document.createElement('strong');title.textContent='Espaço '+(index+1);b.appendChild(title);if(s){let img=document.createElement('img');img.src=s.thumb||'';img.alt='Miniatura do local guardado';b.appendChild(img);let meta=document.createElement('small');meta.textContent=(s.chapter||chapterName(s.phase))+' · '+(s.location||(s.phase===0?'Bairro pobre':'Túnel'));b.appendChild(meta);let tm=document.createElement('em');tm.textContent='Tempo: '+fmtTime(s.playSeconds)+' · '+(s.player?.hp??'?')+' ♥ · '+(s.player?.mking??'?')+' Mking';b.appendChild(tm);let act=document.createElement('small');act.textContent=mode==='save'?'Clique para substituir':'Clique para carregar';b.appendChild(act)}else{let empty=document.createElement('small');empty.textContent=mode==='save'?'Vazio — guardar aqui':'Espaço vazio';b.appendChild(empty)}b.onclick=()=>{if(mode==='save'){let ss=getSlots();ss[index]={version:2,phase,player:{...player},enemy:enemy.map(e=>({...e})),dialog:[...dialog],di,win,playSeconds,unlockedAreas,levelEnemies,storyFlags,quickSlots:[...quickSlots],inventory:{...inventory},selectedQuick,skillPoints,skills:{...skills},chapter:chapterName(phase),location:worlds[phase].name,created:new Date().toISOString(),thumb:makeThumbnail()};try{setSlots(ss);notice.textContent='✓ Guardado no espaço '+(index+1)}catch(e){notice.textContent='Não foi possível guardar (armazenamento cheio).'}}else loadGame(index)};grid.appendChild(b)});button('Voltar',()=>showMenu(gameMode==='menu'?'menu':'paused'))}
function makeThumbnail(){try{let t=document.createElement('canvas');t.width=320;t.height=120;let x=t.getContext('2d');x.fillStyle='#101725';x.fillRect(0,0,320,120);for(let k=0;k<8;k++){x.fillStyle='#35415a';x.fillRect(k*45,35-(k*13%25),35,85)}x.fillStyle='#394353';x.fillRect(0,88,320,32);x.fillStyle='#bc4237';x.fillRect(145,48,24,25);x.fillStyle='#f4e6c9';x.fillRect(150,54,4,4);x.fillRect(160,54,4,4);x.fillStyle='#e4bd7c';x.font='bold 12px system-ui';x.fillText(phase===0?'SPERANZU':'TÚNEL ABANDONADO',8,16);return t.toDataURL('image/jpeg',.55)}catch(e){return ''}}
function showMenu(mode){gameMode=mode;overlay.classList.remove('hidden');pauseButton.hidden=true;quickbar.hidden=true;clearMenu();if(mode==='menu'){button('Novo jogo',()=>{reset();resume()});button('Continuar — escolher gravação',()=>renderSlots('load'),!getSlots().some(Boolean));button('Controlos',()=>{notice.textContent='A/D ou setas: mover · Espaço: saltar · E: falar · J: explosão · 1–5: ações rápidas · Esc/P: pausa';button('Voltar',()=>showMenu('menu'))})}else{button('Continuar a jogar',resume);button('Mapa / Voltar a níveis anteriores',areaMenu);button('Inventário / Equipamentos',showInventory);button('Habilidades do TNT · '+skillPoints+' pontos',showSkills);button('Configurar 5 teclas rápidas',showQuickConfig);button('Guardar partida…',()=>renderSlots('save'));button('Carregar gravação…',()=>renderSlots('load'),!getSlots().some(Boolean));button('Voltar ao menu principal',()=>showMenu('menu'))}}
function resume(){gameMode='playing';overlay.classList.add('hidden');pauseButton.hidden=false;quickbar.hidden=false;renderQuickbar();for(let k in keys)keys[k]=false;lastInteract=lastAttack=lastJump=lastDodge=false}
function togglePause(){if(gameMode==='playing')showMenu('paused');else if(gameMode==='paused')resume()}
function loadGame(index){try{let s=getSlots()[index];if(!s||!worlds[s.phase]||!s.player||!Array.isArray(s.enemy))throw Error('invalid');reset();phase=s.phase;player=s.player;levelEnemies=Array.isArray(s.levelEnemies)?s.levelEnemies:worlds.map((_,i)=>makeEnemies(i));while(levelEnemies.length<worlds.length)levelEnemies.push(makeEnemies(levelEnemies.length));storyFlags=s.storyFlags||{};skills={blast:0,heart:0,agility:0,healing:0,...(s.skills||{})};skillPoints=Math.max(0,s.skillPoints||0);levelEnemies[phase]=s.enemy;enemy=levelEnemies[phase];unlockedAreas=s.unlockedAreas||Math.max(1,phase+1);player.maxHp=player.maxHp||3;player.level=player.level||1;player.xp=player.xp||0;dialog=Array.isArray(s.dialog)?s.dialog:[];di=s.di||0;win=!!s.win;playSeconds=s.playSeconds||0;quickSlots=Array.isArray(s.quickSlots)&&s.quickSlots.length===5?s.quickSlots:quickSlots;inventory={potion:0,blade:0,...(s.inventory||inventory)};selectedQuick=s.selectedQuick||0;particles=[];flash=0;camera=Math.max(0,player.x-W*.32);resume()}catch(e){notice.textContent='Não foi possível carregar esta gravação.'}}
